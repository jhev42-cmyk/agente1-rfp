name: Generate Materiales CSV

on:
  push:
    paths:
      - 'public/normas-seleccionadas.txt'
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Run Python script
        run: |
          cd ${{ github.workspace }}
          python demo_MediaTension.py

      - name: Check if CSV was generated
        run: |
          if [ -f "public/materiales_normas_celsia.csv" ]; then
            echo "✅ CSV generado correctamente"
            ls -lh public/materiales_normas_celsia.csv
          else
            echo "❌ Error: CSV no fue generado"
            exit 1
          fi

      - name: Commit and push CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/materiales_normas_celsia.csv
          git commit -m "Generate materiales_normas_celsia.csv from normas-seleccionadas.txt

Auto-generated by GitHub Actions
          " || echo "No changes to commit"
          git push
